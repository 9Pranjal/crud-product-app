<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoppers' Stop — Product Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Shoppers' Stop</h1>
      <span class="brand-dot"></span>
    </div>
    <p class="tagline">Get everything you need, all in one place</p>
  </header>

  <main class="app-main">

    <section class="glass-panel form-panel">
      <h2 class="panel-title">Add a Product</h2>

      <form id="productForm" novalidate>
        <div class="form-grid">

          <div class="field">
            <label for="titleInput">Product Title</label>
            <input type="text" id="titleInput" placeholder="e.g. Wireless Headphones" />
          </div>

          <div class="field">
            <label for="priceInput">Price (₹)</label>
            <input type="number" id="priceInput" placeholder="e.g. 1499" min="0" step="0.01" />
          </div>

          <div class="field">
            <label for="imageInput">Image URL</label>
            <input type="text" id="imageInput" placeholder="https://example.com/image.jpg" />
          </div>

          <div class="field">
            <label for="categoryInput">Category</label>
            <select id="categoryInput">
              <option value="">Select category</option>
              <option value="Electronics">Electronics</option>
              <option value="Fashion">Fashion</option>
              <option value="Shoes">Shoes</option>
              <option value="Books">Books</option>
              <option value="Food">Food</option>
            </select>
          </div>

        </div>

        <div class="preview-row">
          <div class="preview-thumb" id="previewThumb">
            <span id="previewPlaceholder">Image preview</span>
            <img id="previewImage" alt="Product preview" style="display:none;" />
          </div>
          <div class="preview-hint">Paste a link above and the picture shows up here.</div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">Add Product</button>
          <button type="button" id="cancelEditBtn" class="btn btn-ghost" style="display:none;">Cancel Edit</button>
        </div>
      </form>
    </section>

    <section class="glass-panel controls-panel">
      <div class="control">
        <label for="searchInput">Search</label>
        <input type="text" id="searchInput" placeholder="Search by title..." />
      </div>

      <div class="control">
        <label for="sortSelect">Sort by price</label>
        <select id="sortSelect">
          <option value="none">No sorting</option>
          <option value="lowToHigh">Price: Low to High</option>
          <option value="highToLow">Price: High to Low</option>
        </select>
      </div>

      <div class="control">
        <label for="filterSelect">Filter by category</label>
        <select id="filterSelect">
          <option value="all">All Categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Fashion">Fashion</option>
          <option value="Shoes">Shoes</option>
          <option value="Books">Books</option>
          <option value="Food">Food</option>
        </select>
      </div>
    </section>

    <section class="products-section">
      <div class="products-header">
        <h2 class="panel-title">Your Products</h2>
        <span id="productCount" class="product-count">0 items</span>
      </div>

      <div id="productGrid" class="product-grid">
       
      </div>

      <p id="emptyMessage" class="empty-message" style="display:none;">
        No Products Found — add your product 
      </p>
    </section>

  </main>

  <footer class="app-footer">
    <p>By Pranjal Rathod</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
